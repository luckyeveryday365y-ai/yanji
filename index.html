<script>
(()=>{'use strict';
const DB_NAME='yanji-mobile-v1',TABLE='cards';const SUBJECTS={math:'考研数学一',major:'专业课',english:'考研英语',politics:'考研政治'};
const $=s=>document.querySelector(s), uid=()=>globalThis.crypto?.randomUUID?.()||('id'+Date.now()+Math.random().toString(16).slice(2));
let db,trashDb,trashCards=[], cards=[],logs=[],tab='home',notice='',filter='all',search='',activeId='',flipped=false,draft=null,preview=[],fsrsLib=null,ready=false,pasteText='',importSubject='major',importDeck='',editPreview=false,viewId='',detailAnswer=false,replacePasteText='',replacePending=null,lightboxScale=1,dateSort='dateDesc', treeDb,tree={nodes:[],placements:{}},folderView='',libraryFolder='all',importFolder='major',selectedCardIds=new Set(),mergePreview=null,movingCardId='',folderMoveId='',listLimit=80,installHelpShown=false;
const esc=t=>String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const iso=()=>new Date().toISOString();const cleanTags=t=>Array.isArray(t)?t.map(String).filter(Boolean):String(t||'').split(/[,，、]/).map(x=>x.trim()).filter(Boolean);
function dbOpen(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('cards'))d.createObjectStore('cards',{keyPath:'id'});if(!d.objectStoreNames.contains('logs'))d.createObjectStore('logs',{keyPath:'id'});};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function storeAll(name){return new Promise((res,rej)=>{const r=db.transaction(name,'readonly').objectStore(name).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function putMany(name,items){return new Promise((res,rej)=>{const tx=db.transaction(name,'readwrite');for(const item of items)tx.objectStore(name).put(item);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
function deleteOne(name,id){return new Promise((res,rej)=>{const tx=db.transaction(name,'readwrite');tx.objectStore(name).delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
function trashOpen(){return new Promise((resolve,reject)=>{const r=indexedDB.open('yanji-trash-v1',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('cards'))r.result.createObjectStore('cards',{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function trashRead(){return new Promise((resolve,reject)=>{const q=trashDb.transaction('cards','readonly').objectStore('cards').getAll();q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
function trashSave(items){return new Promise((resolve,reject)=>{const tx=trashDb.transaction('cards','readwrite');for(const c of items)tx.objectStore('cards').put(c);tx.oncomplete=()=>resolve();tx.onabort=()=>reject(tx.error||new Error('回收站写入失败'));tx.onerror=()=>reject(tx.error)})}
function deleteByIds(database,store,ids){return new Promise((resolve,reject)=>{const tx=database.transaction(store,'readwrite');for(const id of ids)tx.objectStore(store).delete(id);tx.oncomplete=()=>resolve();tx.onabort=()=>reject(tx.error||new Error('卡片移除失败'));tx.onerror=()=>reject(tx.error)})}
function trashReplace(items){return new Promise((resolve,reject)=>{const tx=trashDb.transaction('cards','readwrite'),store=tx.objectStore('cards');store.clear();for(const c of items)store.put(c);tx.oncomplete=()=>resolve();tx.onabort=()=>reject(tx.error||new Error('回收站恢复失败'));tx.onerror=()=>reject(tx.error)})}
async function archiveCards(ids,reason='手动删除'){
 const unique=[...new Set(ids)],originals=unique.map(id=>cards.find(c=>c.id===id));
 if(!unique.length||originals.some(x=>!x))throw Error('所选原卡片已不存在，请刷新后重试');
 const time=iso();
 const snapshot=originals.map(c=>({...structuredClone(c),folderId:cardFolder(c),trashedAt:time,trashReason:reason}));
 await trashSave(snapshot);
 await deleteByIds(db,'cards',unique);
 return unique.length;
}
async function untrashCard(id){
 const item=trashCards.find(c=>c.id===id);if(!item)throw Error('回收站中找不到此卡');
 if(cards.some(c=>c.id===id))throw Error('卡片库中已存在同编号卡片；为防止覆盖，请勿重复恢复');
 const target=folder(item.folderId)?item.folderId:folder(item.subject)?item.subject:(folder('major')?'major':tree.nodes[0]?.id);
 if(!folder(target))throw Error('无法选择恢复目录');
 const copy=structuredClone(item);delete copy.trashedAt;delete copy.trashReason;copy.folderId=target;
 await putMany('cards',[copy]);tree.placements[id]=target;
 try{await saveTree()}catch(e){console.warn('卡片已经恢复，目录索引未能立即更新',e)}
 try{await deleteByIds(trashDb,'cards',[id])}catch(e){await refresh();throw Error('卡片已恢复，但回收站副本仍在。请刷新后核对')}
 await refresh();alertMsg('恢复成功：正反面、图片、FSRS 状态和历史复习记录均保留');
}
function trashPage(){
 const sorted=[...trashCards].sort((a,b)=>String(b.trashedAt||'').localeCompare(String(a.trashedAt||'')));
 const items=sorted.slice(0,listLimit);
 const rows=items.map(c=>`<div class="list-card"><div class="row"><div class="grow" style="min-width:0"><b style="display:block;overflow-wrap:anywhere">${esc(String(c.front||'').slice(0,100))}</b><p class="small muted">${esc(c.trashedAt?new Date(c.trashedAt).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'}):'删除时间未知')} · ${esc(folder(c.folderId)?folderPath(c.folderId):'原目录已不存在')}</p></div><button class="btn secondary" data-trash-restore="${esc(c.id)}">恢复</button></div><details><summary class="small muted">展开卡片内容与图片</summary><div class="rich">${rich(c.front)}</div>${imageHTML(c.frontImages)}<div class="divider"></div><div class="rich">${c.back?rich(c.back):'<span class="muted">（仅正面卡片）</span>'}</div>${imageHTML(c.backImages)}</details></div>`).join('');
 const more=sorted.length>listLimit?`<button class="btn secondary full" data-more="1">继续显示（剩余 ${sorted.length-listLimit} 张）</button>`:'';
 return base('♻️ 回收站','<button class="btn secondary" data-go="settings">返回设置</button>')+panel(`<h3>共 ${trashCards.length} 张可恢复卡片</h3><p class="small muted">删除先保存到本机回收站，不会自动清空。但清除 Safari 网站数据可能同时清除回收站，请定期备份。</p><button class="btn secondary full" data-backup="1">导出完整备份（含回收站）</button>`)+panel((rows||'<div class="empty">回收站为空</div>')+more);
}
function replaceAll(data){return new Promise((res,rej)=>{const tx=db.transaction(['cards','logs'],'readwrite');tx.objectStore('cards').clear();tx.objectStore('logs').clear();for(const c of data.cards)tx.objectStore('cards').put(c);for(const l of data.logs)tx.objectStore('logs').put(l);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function refresh(){cards=await storeAll('cards');logs=await storeAll('logs');trashCards=await trashRead();render()}
function alertMsg(m){notice=m;render()}
function normalizeImg(list){return (Array.isArray(list)?list:[]).map(im=>typeof im==='string'?{dataUrl:im,alt:''}:{dataUrl:im?.dataUrl||im?.src||im?.data||'',alt:im?.alt||im?.name||''}).filter(im=>/^data:image\/(png|jpeg|jpg|webp|gif|heic|heif);base64,/i.test(im.dataUrl)).slice(0,6)}
function normalizeCard(x,override){const n=x?.note||{};return {id:uid(),subject:SUBJECTS[x.subject]?x.subject:override||'major',deck:String(x.deck||x.deckName||SUBJECTS[override]||SUBJECTS[x.subject]||'专业课'),front:String(x.front||x.question||n.front||n.text||''),back:String(x.back||x.answer||n.back||n.meaning||''),tags:cleanTags(x.tags||n.tags||n.themes),frontImages:normalizeImg(x.frontImages||x.images?.front||[]),backImages:normalizeImg(x.backImages||x.images?.back||[]),createdAt:iso(),due:iso(),fsrs:null,reviewCount:0};}
function hasBackContent(c){return Boolean(String(c.back||'').trim()||normalizeImg(c.backImages).length)}

/* Folder metadata is kept in a separate IndexedDB database so the V1.4/V1.5 database version stays unchanged. */
const DEFAULT_FOLDERS=[{id:'math',name:'考研数学一',parentId:null},{id:'major',name:'专业课',parentId:null},{id:'english',name:'考研英语',parentId:null},{id:'politics',name:'考研政治',parentId:null}];
const TREE_DB='yanji-folders-v1';
function treeOpen(){return new Promise((ok,no)=>{const r=indexedDB.open(TREE_DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('meta'))r.result.createObjectStore('meta',{keyPath:'id'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function readTree(){return new Promise((ok,no)=>{const r=treeDb.transaction('meta','readonly').objectStore('meta').get('tree');r.onsuccess=()=>ok(r.result?.value||null);r.onerror=()=>no(r.error)})}
function saveTree(){return new Promise((ok,no)=>{const tx=treeDb.transaction('meta','readwrite');tx.objectStore('meta').put({id:'tree',value:structuredClone(tree)});tx.oncomplete=()=>ok();tx.onerror=()=>no(tx.error)})}
function folder(id){return tree.nodes.find(n=>n.id===id)||null}
function children(id){return tree.nodes.filter(n=>n.parentId===id)}
function descendants(id){const out=new Set([id]);let work=[id],steps=0;while(work.length&&steps++<50000){const current=work.shift();for(const n of children(current))if(!out.has(n.id)){out.add(n.id);work.push(n.id)}}return out}
function ancestors(id){const chain=[],seen=new Set();let n=folder(id);while(n&&!seen.has(n.id)){chain.unshift(n);seen.add(n.id);n=folder(n.parentId)}return chain}
function rootFor(id){return ancestors(id)[0]||folder('major')||tree.nodes.find(n=>!n.parentId)||null}
function folderPath(id){return ancestors(id).map(x=>x.name).join(' / ')||'未分类'}
function folderChoice(selected='',allowAll=false,excludeIds=new Set()){let out=allowAll?'<option value="all">全部卡片（所有目录）</option>':'';function walk(pid,depth,seen){for(const n of children(pid)){if(seen.has(n.id)||excludeIds.has(n.id))continue;out+=`<option value="${esc(n.id)}" ${selected===n.id?'selected':''}>${'　'.repeat(Math.min(depth,16))}${depth?'↳ ':''}${esc(n.name)}</option>`;walk(n.id,depth+1,new Set([...seen,n.id]))}}walk(null,0,new Set());return out}
function cardFolder(c){const id=tree.placements[c.id]||c.folderId;if(folder(id))return id;const root=folder(c.subject)?rootFor(c.subject)?.id:'major';return root||tree.nodes[0]?.id||'major'}
function cardsUnder(id,includingChildren=true){if(id==='all')return cards.slice();const matched=includingChildren?descendants(id):new Set([id]);return cards.filter(c=>matched.has(cardFolder(c)))}
function dueOf(list){const now=Date.now();return list.filter(c=>new Date(c.fsrs?.due||c.due||0).getTime()<=now).length}
function validateImportedTree(candidate){if(!candidate||!Array.isArray(candidate.nodes)||candidate.nodes.length>20000||!candidate.placements||typeof candidate.placements!=='object'||Array.isArray(candidate.placements))throw Error('备份中的目录结构无效');const m=new Map();for(const n of candidate.nodes){if(!n||typeof n.id!=='string'||!n.id||m.has(n.id)||typeof n.name!=='string'||!n.name||!('parentId' in n))throw Error('备份中存在重复或无效目录');m.set(n.id,n)}for(const n of candidate.nodes){if(n.parentId!==null&&!m.has(n.parentId))throw Error('备份中有缺失的上级目录');const seen=new Set();let cur=n;while(cur){if(seen.has(cur.id))throw Error('备份中存在循环目录');seen.add(cur.id);cur=cur.parentId===null?null:m.get(cur.parentId)}}for(const id of Object.values(candidate.placements))if(!m.has(id))throw Error('备份存在无效卡片目录');return candidate}
function validFolderName(value){const name=String(value??'').trim().replace(/\s+/g,' ');if(name.length<1||name.length>70||/[<>]/.test(name))throw Error('目录名称必须是 1～70 个字符，不能包含 < 或 >');return name}
function siblingExists(name,parentId,exceptId){return tree.nodes.some(n=>n.parentId===parentId&&n.id!==exceptId&&n.name.toLowerCase()===name.toLowerCase())}
function ensureFolders(){let changed=false;
 for(const c of cards){if(!c||!c.id)continue;if(folder(c.folderId)){if(tree.placements[c.id]!==c.folderId){tree.placements[c.id]=c.folderId;changed=true}continue}if(folder(tree.placements[c.id]))continue;
 let root=folder(c.subject);if(!root){const sid=String(c.subject||'major');root={id:sid,name:SUBJECTS[sid]||sid,parentId:null};tree.nodes.push(root);changed=true}
 const deck=String(c.deck||'').trim();let target=root;
 if(deck&&deck!==root.name){target=tree.nodes.find(n=>n.parentId===root.id&&n.name===deck);if(!target){target={id:'folder_'+uid(),parentId:root.id,name:deck};tree.nodes.push(target);changed=true}}
 tree.placements[c.id]=target.id;changed=true}
 for(const id of Object.keys(tree.placements))if(!cards.some(c=>c.id===id)){delete tree.placements[id];changed=true}
 return changed}
async function readLegacyCatalog(){try{return await new Promise((resolve)=>{const q=indexedDB.open('yanji-catalog-v1',1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('meta'))q.result.createObjectStore('meta',{keyPath:'id'})};q.onerror=()=>resolve(null);q.onsuccess=()=>{const d=q.result;try{const r=d.transaction('meta','readonly').objectStore('meta').get('catalog');r.onsuccess=()=>{d.close();resolve(r.result?.value||null)};r.onerror=()=>{d.close();resolve(null)}}catch(e){d.close();resolve(null)}}})}catch(e){return null}}
function convertLegacyCatalog(cat){if(!cat||!Array.isArray(cat.subjects)||!Array.isArray(cat.decks))return null;const nodes=[];const seen=new Set();for(const s of cat.subjects){const id=String(s.id||'');if(!id||seen.has(id))continue;nodes.push({id,name:String(s.name||id),parentId:null});seen.add(id)}for(const d of cat.decks){if(!seen.has(d.subjectId))continue;const id=String(d.id||('folder_'+uid()));if(seen.has(id))continue;nodes.push({id,name:String(d.name||'未命名'),parentId:String(d.subjectId)});seen.add(id)}if(!nodes.length)return null;const placements={};for(const c of cards){const found=nodes.find(n=>n.parentId===c.subject&&n.name===c.deck);if(found)placements[c.id]=found.id}return {nodes,placements}}
async function initTree(){treeDb=await treeOpen();const old=await readTree();if(old&&Array.isArray(old.nodes)&&old.placements&&typeof old.placements==='object')tree=structuredClone(old);else tree=convertLegacyCatalog(await readLegacyCatalog())||{nodes:DEFAULT_FOLDERS.map(x=>({...x})),placements:{}};if(ensureFolders()||!old)await saveTree()}
async function afterCardChanges(){if(ensureFolders())await saveTree()}
async function newFolder(parentId=null){if(parentId!==null&&!folder(parentId))throw Error('上级目录不存在');const raw=prompt(parentId?'在「'+folderPath(parentId)+'」下新建子目录：':'新建一级科目：');if(raw===null)return;const name=validFolderName(raw);if(siblingExists(name,parentId))throw Error('同一级目录下已经有同名目录');const node={id:'folder_'+uid(),name,parentId};tree.nodes.push(node);await saveTree();folderView=parentId||node.id;tab=parentId?'folder':'folders';alertMsg('已创建目录：'+name)}
async function renameFolder(id){const n=folder(id);if(!n)return;const raw=prompt('重命名目录：',n.name);if(raw===null)return;const name=validFolderName(raw);if(siblingExists(name,n.parentId,id))throw Error('同一级目录下已经有同名目录');n.name=name;await saveTree();alertMsg('目录已重命名，原卡片内容和复习进度不变')}
async function deleteFolder(id){const n=folder(id);if(!n)return;if(n.parentId===null&&children(null).length<=1)throw Error('至少保留一个一级科目');if(children(id).length||cardsUnder(id,false).length)throw Error('目录非空。请先移动其中的卡片并清理子目录。');if(!confirm('删除空目录「'+n.name+'」？'))return;tree.nodes=tree.nodes.filter(x=>x.id!==id);await saveTree();if(folderView===id)folderView=n.parentId||'';alertMsg('已删除空目录')}
async function moveFolder(id,parentId){const n=folder(id);if(!n)throw Error('目录不存在');if(parentId!==null&&!folder(parentId))throw Error('目标目录不存在');if(descendants(id).has(parentId))throw Error('不能把目录移动到自身或其下级');if(siblingExists(n.name,parentId,id))throw Error('目标下已有同名目录');n.parentId=parentId;await saveTree();folderMoveId='';alertMsg('目录已移动，包含的卡片和子目录保持不变')}
async function relocateCards(ids,target){if(!folder(target))throw Error('请选择有效的目标目录');const moved=cards.filter(c=>ids.includes(c.id));if(!moved.length)throw Error('请先选择要移动的卡片');const root=rootFor(target);const modified=moved.map(c=>({...c,folderId:target,subject:root?.id||c.subject,deck:folder(target)?.name||c.deck}));await putMany('cards',modified);for(const c of modified)tree.placements[c.id]=target;await saveTree();selectedCardIds.clear();movingCardId='';await refresh();alertMsg(`已移动 ${modified.length} 张卡片至「${folderPath(target)}」；图片、公式和复习进度均保留`)}
function breadcrumb(id){const a=ancestors(id);return `<div class="crumbs"><button data-go="folders">全部目录</button>${a.map(n=>`<span>›</span><button data-folder-open="${esc(n.id)}">${esc(n.name)}</button>`).join('')}</div>`}

const DATE_ZONE='Asia/Shanghai';
const importDayFmt=new Intl.DateTimeFormat('en-US',{timeZone:DATE_ZONE,year:'numeric',month:'2-digit',day:'2-digit'});
function importMs(c){const candidate=c.importedAt||c.createdAt;const ms=Date.parse(candidate||'');return Number.isFinite(ms)?ms:0}
function importDay(ms){if(!ms)return '';const fields=Object.fromEntries(importDayFmt.formatToParts(new Date(ms)).map(p=>[p.type,p.value]));return `${fields.year}-${fields.month}-${fields.day}`}
function dayLabel(day){if(!day)return '导入日期未知';const [year,month,date]=day.split('-');return `${year} 年 ${Number(month)} 月 ${Number(date)} 日`}
function dateSortSelect(){return `<div class="date-sort"><label for="dateSort">按导入日期排列（北京时间）</label><select id="dateSort"><option value="dateDesc" ${dateSort==='dateDesc'?'selected':''}>日期由新到旧，同一天先导入的在前（默认）</option><option value="dateAsc" ${dateSort==='dateAsc'?'selected':''}>日期由旧到新，同一天先导入的在前</option><option value="withinDesc" ${dateSort==='withinDesc'?'selected':''}>日期由新到旧，同一天后导入的在前</option></select></div>`}
function orderedByImport(list){const fallback=new Map(cards.map((c,i)=>[c.id,i]));return list.slice().sort((a,b)=>{
 const aMs=importMs(a),bMs=importMs(b),ad=importDay(aMs),bd=importDay(bMs);
 // The unknown-date group stays last in every mode.
 if(!ad&&bd)return 1;if(ad&&!bd)return -1;
 if(ad!==bd)return dateSort==='dateAsc'?(ad<bd?-1:1):(ad>bd?-1:1);
 const reverse=dateSort==='withinDesc'?-1:1;
 if(aMs!==bMs)return (aMs-bMs)*reverse;
 const aSeq=Number.isSafeInteger(a.importSequence)?a.importSequence:null,bSeq=Number.isSafeInteger(b.importSequence)?b.importSequence:null;
 if(aSeq!==null&&bSeq!==null&&aSeq!==bSeq)return (aSeq-bSeq)*reverse;
 // Equal timestamps on old cards cannot establish historical batch ordering.
 return ((fallback.get(a.id)??0)-(fallback.get(b.id)??0))*reverse;
})}
function dateSections(list,renderCard){if(!list.length)return '';const groupMap=new Map();for(const c of list){const key=importDay(importMs(c));if(!groupMap.has(key))groupMap.set(key,[]);groupMap.get(key).push(c)}return [...groupMap].map(([date,items])=>`<section class="date-section"><div class="date-heading"><strong>📅 ${dayLabel(date)}</strong><span>${items.length} 张</span></div>${items.map(renderCard).join('')}</section>`).join('')}
function nextImportSequence(){return 1+cards.reduce((max,c)=>Math.max(max,Number.isSafeInteger(c.importSequence)?c.importSequence:0),0)}

function folderManageTree(parentId=null,depth=0,seen=new Set()){if(depth>64)return '<p class="warn small">目录层数过多，已停止渲染；数据仍保留。</p>';return children(parentId).filter(n=>!seen.has(n.id)).map(n=>{const cs=cardsUnder(n.id);const nested=folderManageTree(n.id,depth+1,new Set([...seen,n.id]));return `<div class="folder-entry"><div class="row"><button class="card-link grow" data-folder-open="${esc(n.id)}"><span class="name">📁 ${esc(n.name)}</span><span class="small muted" style="display:block">${depth+1} 级 · ${cs.length} 张（含下级）</span></button></div><div class="folder-actions"><button class="btn secondary" data-add-folder="${esc(n.id)}">＋ 子目录</button><button class="btn secondary" data-rename-folder="${esc(n.id)}">改名</button><button class="btn secondary" data-folder-move="${esc(n.id)}">移动目录</button><button class="btn danger" data-delete-folder="${esc(n.id)}">删除空目录</button></div>${folderMoveId===n.id?`<div class="select-actions"><label class="small">目标上级目录</label><select id="folderMoveTarget"><option value="root">顶层（一级）</option>${folderChoice('',false,descendants(n.id))}</select><button class="btn full" data-confirm-folder-move="${esc(n.id)}">确认移动该目录</button></div>`:''}${nested?`<div class="folder-branch">${nested}</div>`:''}</div>`}).join('')}
function foldersPage(){return `${base('自定义目录',`<button class="btn secondary" data-go="home">首页</button>`)}${panel(`<p class="small muted">目录层级不设固定上限。创建一级科目后，可在任意目录继续新建下级目录；空目录可删除，移动目录会连带其下级结构。</p><button class="btn full" data-add-root="1">＋ 新建一级科目</button>`)}${panel(`<h3>全部目录</h3>${folderManageTree()||'<p class="muted">暂时没有目录</p>'}`)}`}
function mergeSelection(){
 const scope=libraryFolder==='all'?cards:cardsUnder(libraryFolder),q=search.toLowerCase();
 return orderedByImport(scope.filter(c=>selectedCardIds.has(c.id)&&(!q||`${c.front||''} ${c.back||''} ${cleanTags(c.tags).join(' ')}`.toLowerCase().includes(q))));

function buildMergedCard(items){
 if(items.length<2)throw Error('请至少选择 2 张卡片进行合并');
 if(items.length>25)throw Error('一次最多合并 25 张卡片，请分批操作');
 const frontImages=items.flatMap(c=>normalizeImg(c.frontImages)),backImages=items.flatMap(c=>normalizeImg(c.backImages));
 if(frontImages.length>6||backImages.length>6)throw Error(`选中卡片的正面有 ${frontImages.length} 张图，背面有 ${backImages.length} 张图；每面最多 6 张，请减少所选卡片，避免图片丢失`);
 const target=cardFolder(items[0]);
 if(!folder(target))throw Error('未找到卡片原始目录');
 const root=rootFor(target);
 const front=items.map((c,i)=>`【${i+1}】\n${String(c.front||'').trim()}`).join('\n\n');
 const anyBack=items.some(c=>hasBackContent(c));
 const back=anyBack?items.map((c,i)=>`【${i+1}】\n${String(c.back||'').trim()||(normalizeImg(c.backImages).length?'（对应图片见下方，按原卡顺序排列）':'（原卡没有背面内容）')}`).join('\n\n'):'';
 const tags=[...new Set(items.flatMap(c=>cleanTags(c.tags)))];
 const card=normalizeCard({subject:root?.id||'major',deck:folder(target).name,front,back,tags,frontImages,backImages},root?.id||'major');
 card.folderId=target;card.mergedFrom=items.map(c=>c.id);
 return card;
}
function mergePreviewPanel(){
 if(!mergePreview)return '';

 return `<div class="merge-preview" id="mergePreview"><div class="row"><h3>合并预览 · ${mergePreview.ids.length} 张 → 1 张</h3><button class="btn secondary" data-merge-cancel="1">取消</button></div><p class="merge-note">按当前卡片总览显示顺序合并；正面和背面分别编号。原始卡片、图片、学习进度和复习历史不会删除。</p><p><b>合并后正面</b></p><div class="rich">${rich(c.front)}</div>${c.frontImages.length?`<p class="merge-note">正面图片 ${c.frontImages.length} 张：</p>${imageHTML(c.frontImages)}`:''}<p><b>合并后背面</b></p><div class="rich">${c.back?rich(c.back):'<span class="muted">（仅正面卡片）</span>'}</div>${c.backImages.length?`<p class="merge-note">背面图片 ${c.backImages.length} 张：</p>${imageHTML(c.backImages)}`:''}<div class="field"><label>合并卡存放目录</label><select id="mergeFolder" class="folder-picker">${folderChoice(c.folderId)}</select></div><p class="merge-note">新合并卡会从新卡开始安排 FSRS 复习。默认保留原卡。</p><label class="merge-note" style="display:flex;align-items:center;gap:8px;padding:10px 0"><input type="checkbox" id="mergeTrashOriginals" style="width:19px;height:19px;flex:none">合并成功后将原卡移入回收站（可恢复）</label><button class="btn full" data-merge-save="1">确认创建合并卡</button></div>`;
}
function previewMerge(){
 const items=mergeSelection(),card=buildMergedCard(items);
 mergePreview={ids:items.map(c=>c.id),card};render();
}
async function saveMergedCard(){
 if(!mergePreview)throw Error('请先预览合并结果');
 if(mergePreview.ids.some(id=>!selectedCardIds.has(id)))throw Error('所选卡片发生变化，请重新预览');
 const items=mergePreview.ids.map(id=>cards.find(c=>c.id===id));
 if(items.some(c=>!c))throw Error('原卡片不完整，请重新选择');
 const target=$('#mergeFolder')?.value;
 if(!folder(target))throw Error('请选择有效的存放目录');
 const card=buildMergedCard(items);
 card.folderId=target;card.subject=rootFor(target)?.id||card.subject;card.deck=folder(target).name;
 card.importedAt=iso();card.importSequence=nextImportSequence();
 const shouldArchive=$('#mergeTrashOriginals')?.checked===true;
 await putMany('cards',[card]);tree.placements[card.id]=target;await saveTree();
 let outcome='原卡仍保留在卡片库';
 if(shouldArchive){try{await archiveCards(items.map(c=>c.id),'合并后归档');outcome='原卡已移入回收站，可随时恢复'}catch(e){outcome='原卡归档未完成，请核对卡片库和回收站：'+(e?.message||e)}}
 mergePreview=null;selectedCardIds.clear();tab='library';libraryFolder='all';viewId=card.id;detailAnswer=false;
 await refresh();alertMsg(`合并卡创建成功（${items.length} 张原卡）。${outcome}；原有复习记录均保留`);
}
function cardOverviewResults(){
 const all=libraryFolder==='all'?cards:cardsUnder(libraryFolder);
 const results=all.filter(c=>!search||`${c.front||''} ${c.back||''} ${cleanTags(c.tags).join(' ')}`.toLowerCase().includes(search.toLowerCase()));
 const sorted=orderedByImport(results),shown=sorted.slice(0,listLimit);
 const safeSelected=[...selectedCardIds].filter(id=>results.some(c=>c.id===id));
 const listItem=c=>`<div class="list-card"><div class="row"><input type="checkbox" data-select-card="${esc(c.id)}" aria-label="选中卡片" ${selectedCardIds.has(c.id)?'checked':''} style="width:20px;height:20px;flex:none"><div class="grow" style="min-width:0"><button class="card-link" data-card-open="${esc(c.id)}"><strong class="truncate" style="display:block">${esc(String(c.front).replace(/\$+/g,'').slice(0,95))}</strong><span class="small muted">${esc(folderPath(cardFolder(c)))}</span></button></div><button class="btn secondary" data-edit="${esc(c.id)}">编辑</button></div></div>`;
 return `<p class="small muted">当前范围 ${all.length} 张 · 搜索匹配 ${results.length} 张</p><div class="select-actions"><div class="row"><b>批量管理卡片</b><button class="btn secondary" data-select-visible="1">选中当前显示</button></div><p class="small muted">已选择 ${safeSelected.length} 张卡片。支持批量移动，也可合并生成新卡。</p><select id="moveTarget">${folderChoice(tree.nodes.some(n=>n.id===libraryFolder)?libraryFolder:'major')}</select><button class="btn full" data-move-selected="1" ${!safeSelected.length?'disabled':''}>移动选中卡片</button><button class="btn secondary full" data-merge-preview="1" ${safeSelected.length<2?'disabled':''}>合并选中卡片（至少 2 张）</button>${mergePreviewPanel()}</div>${results.length?dateSections(shown,listItem):'<div class="empty">没有匹配的卡片</div>'}${results.length>listLimit?`<button class="btn secondary full" data-more="1">继续显示（剩余 ${results.length-listLimit} 张）</button>`:''}<p class="small muted">早期卡片若缺少导入序号，将尽量按原始创建时间排序；同一时间戳内的历史先后可能无法还原。</p>`;
}

function home(){const due=dueCards().length;const today=logs.filter(x=>new Date(x.at).toDateString()===new Date().toDateString()).length;return `<div class="home-quick-actions"><button type="button" class="btn secondary" data-refresh-page="1">↻ 刷新网页</button><button type="button" class="btn secondary" data-install-help="1">⌂ 添加到桌面</button></div>${installHelpShown?panel(`<div class="home-install-guide"><h3>📱 将研记添加到 iPhone 桌面</h3><ol><li>使用 <strong>Safari</strong> 打开研记正式网址。</li><li>点击 Safari 的<strong>分享</strong>按钮（方框向上箭头），选择<strong>添加到主屏幕</strong>。</li><li>名称设为<strong>研记</strong>，点击<strong>添加</strong>即可。</li></ol><p class="warn small"><strong>数据提醒：</strong>从桌面打开的网页与 Safari 可能使用不同的本地数据空间。首次打开时请核对卡片数，如数量不同，先从 Safari 备份完整 JSON；不要清除或覆盖原有数据。</p><p class="small muted">桌面快捷方式不是云同步；离线运行仍取决于网页资源是否已缓存。</p></div>`):''}<div class="stats"><div class="stat"><strong>${due}</strong><span>待复习</span></div><div class="stat"><strong>${cards.length}</strong><span>总卡片</span></div><div class="stat"><strong>${today}</strong><span>今日完成</span></div></div>${panel(`<h3>今日复习</h3><p class="muted small">数学一 · 专业课 · 英语 · 政治</p><button class="btn full" data-go="review">${due?'开始复习 '+due+' 张':'查看复习计划'}</button>`)}${panel(`<h3>添加卡片</h3><div class="choice-grid"><button class="choice-tile" data-go="import">📋 粘贴导入<span class="small">复制 ChatGPT / Mochi 格式，一次生成多张卡</span></button><button class="choice-tile" data-create="1">✏️ 手动新建<span class="small">自己输入问题、答案，附加图片与公式</span></button></div>`)}${upgradeReport()}${panel(base('我的学科',`<button class="btn secondary" data-go="folders">管理 / 新增</button>`)+counts())}`}

label><input id="ftags" value="${esc(c.tags.join(', '))}" placeholder="例如：卷积, 推导, 高频"></div><div class="flex"><button class="btn secondary grow" data-edit-preview="1">${editPreview?'隐藏预览':'预览正反面'}</button><button class="btn grow" data-save="1">${c._edit?'保存修改':'保存新卡'}</button></div>${editPreview?`<div class="edit-preview"><b>正面预览</b><div class="rich">${rich(c.front)}</div>${imageHTML(c.frontImages)}<div class="divider"></div><b>背面预览</b><div class="rich">${hasBackContent(c)?rich(c.back):'<span class="muted small">（仅正面卡片）</span>'}</div>${imageHTML(c.backImages)}</div>`:''}${c._edit?`<button class="btn danger full" data-delete="${c.id}" style="margin-top:12px">删除卡片</button>`:''}`)}`}
function previewImages(list,side){return `<div class="image-preview">${normalizeImg(list).map((im,i)=>`<div class="item"><img data-img-open="1" src="${im.dataUrl}" alt="${esc(im.alt||'图片预览')}" title="点击放大"><button type="button" data-remove="${side}:${i}" aria-label="移除图片">×</button></div>`).join('')}</div>`}
function settings(){return `${base('设置与备份')}${panel(`<h3>♻️ 回收站</h3><p class="small muted">目前有 ${trashCards.length} 张卡片可恢复。</p><button class="btn secondary full" data-go="trash">打开回收站（${trashCards.length} 张）</button>`)}${panel(`<h3>数据安全</h3><p class="small muted">卡片、图片、学习进度存于当前 iPhone 浏览器的 IndexedDB。浏览器数据可能被系统清理，请定期备份。</p><button class="btn full" data-backup="1">导出全部备份（JSON）</button><label class="import-zone" style="margin-top:12px">从备份恢复<input type="file" id="restorefile" accept=".json"></label><p class="warn small">恢复会替换当前全部卡片和记录。请先下载备份。</p>`)}${panel(`<h3>版本说明</h3><p class="small">V1.13：iPhone 桌面快捷入口引导和首页刷新按钮；V1.12：独立回收站、误删恢复、备份回收站，合并完成时可选将原卡移入回收站；V1.11：卡片总览支持勾选两张以上卡片，预览并复制合并为新卡（保留原卡和复习历史）；V1.10：修复 iPhone 中文拼音搜索输入（保留输入框，按需刷新结果）；V1.9：支持仅正面卡片（手动新建、编辑、批量导入与复习）；V1.8：按北京时间导入日期分组、批量导入保序、日期排序切换；V1.7：任意级目录、卡片总览、单张及批量移动、目录管理；V1.5 图片自适应、点击放大、支持编辑时粘贴覆盖正反面；保留首页学科导航和卡片详情浏览；支持直接粘贴 Mochi / Markdown 卡片、手动新建编辑、批量导入、公式显示、图片与本地存储。</p><p class="small">公式使用在线 KaTeX，FSRS 使用在线 ts-fsrs；未加载成功时会显示原始公式或回退基础调度。完整离线 PWA 缓存将在独立 Service Worker 部署后启用。</p><p class="small muted">不采集账号信息，不上传你的卡片数据。</p>`)}`}
function render(){const view=$('#view');if(!view)return;view.innerHTML=(notice?`<div class="notice">${esc(notice)} <button style="float:right" data-clear="1">×</button></div>`:'')+(!ready?panel('正在加载本地数据…'):draft?form():viewId?cardDetail():({home,review,library,folders:foldersPage,folder:folderPage,import:importPage,settings,trash:trashPage}[tab]||home)());document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#mode').textContent=fsrsLib?'FSRS 已就绪':'本地存储'}
function download(name,text){const blob=new Blob([text],{type:'application/json;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),10000)}
function mdCards(t){const parts=String(t||'').replace(/\r\n?/g,'\n').replace(/^\uFEFF/,'').split(/^\s*\/\/\/\s*$/m).filter(x=>x.trim());if(!parts.length)return [];return parts.map((part,i)=>{const a=part.split(/^\s*---\s*$/m),front=a.shift().trim(),back=a.join('\n---\n').trim();if(!front)throw Error(`第 ${i+1} 张卡片格式错误：正面不能为空`);return {front,back}})}
function importOptions(){const id=$('#importFolder')?.value||importFolder||'major';return {folderId:id,subject:rootFor(id)?.id||'major',deck:folder(id)?.name||'专业课'}}
function toImportCards(raw,options){return raw.map(x=>({...normalizeCard({...x,subject:options.subject,deck:options.deck},options.subject),folderId:options.folderId})).filter(c=>c.front.trim())}
function preparePaste(){preview=[];pasteText=$('#pasteCards')?.value??pasteText;const options=importOptions();importSubject=options.subject;importDeck=options.deck;importFolder=options.folderId;const raw=mdCards(pasteText);if(!raw.length)throw Error('请先粘贴卡片。仅正面可直接粘贴；有背面用 --- 分隔，多张用 /// 分隔');preview=toImportCards(raw,options);if(!preview.length)throw Error('未识别到有效卡片');alertMsg(`已识别 ${preview.length} 张，请在预览后点击确认保存`)}
async function filesToPreview(files){const options=importOptions();importSubject=options.subject;importDeck=options.deck;importFolder=options.folderId;let all=[];for(const f of files){if(f.size>40*1024*1024)throw Error(`${f.name} 太大，请分批导入（单文件上限 40MB）`);const text=await f.text();let raw;if(/\.json$/i.test(f.name)){const data=JSON.parse(text);raw=Array.isArray(data)?data:(data.cards||data.items||data.notes||[]);if(!Array.isArray(raw))throw Error('JSON 没有 cards 数组');}else raw=mdCards(text);all.push(...toImportCards(raw,options))}if(!all.length)throw Error('未识别到有效卡片：请检查 JSON / Markdown 格式');preview=all;alertMsg(`读取成功：${all.length} 张，确认后才会保存`)}
async function addImages(fileList,side){if(!draft)return;captureDraftFields();const list=Array.from(fileList||[]);if(draft[side+'Images'].length+list.length>6)throw Error('每面最多 6 张图片');for(const file of list){if(!file.type.startsWith('image/'))throw Error('只能上传图片');if(file.size>4_000_000)throw Error('每张图片不能超过 4MB');const dataUrl=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(file)});draft[side+'Images'].push({dataUrl,alt:file.name})}render()}
function prepareOverwrite(){if(!draft?._edit)throw Error('请先打开一张已有卡片进行编辑');captureDraftFields();replacePasteText=$('#overwritePaste')?.value??replacePasteText;const parsed=mdCards(replacePasteText);if(parsed.length!==1)throw Error('编辑已有卡片只能粘贴一张；有背面时用 --- 分隔正反面');replacePending=parsed[0];render()}
function applyOverwrite(){if(!draft?._edit||!replacePending)throw Error('请先解析粘贴的卡片');captureDraftFields();draft.front=replacePending.front;draft.back=replacePending.back;replacePending=null;replacePasteText='';render();alertMsg('新内容已填入正反面。核对图片与标签后点击「保存修改」才会生效。')}
async function saveDraft(){if(!draft)return;captureDraftFields();const isEdit=!!draft._edit;if(!folder(draft.folderId))throw Error('请选择存放目录');draft.subject=rootFor(draft.folderId)?.id||draft.subject;draft.deck=folder(draft.folderId)?.name||draft.deck;if(!draft.front.trim())throw Error('请填写卡片正面内容；背面可以留空');const c={...draft};delete c._edit;if(!isEdit){c.importedAt=iso();c.importSequence=nextImportSequence()}await putMany('cards',[c]);tree.placements[c.id]=c.folderId;await saveTree();draft=null;replacePasteText='';replacePending=null;await refresh();alertMsg('卡片保存成功')}
async function rate(v){const c=cards.find(x=>x.id===activeId);if(!c)return;const rating=Number(v);let next=null;try{if(fsrsLib){const {fsrs,Rating,createEmptyCard}=fsrsLib;const old=c.fsrs?{...c.fsrs,due:new Date(c.fsrs.due),last_review:c.fsrs.last_review?new Date(c.fsrs.last_review):undefined}:createEmptyCard(new Date());const result=fsrs({request_retention:0.9}).next(old,new Date(),[null,Rating.Again,Rating.Hard,Rating.Good,Rating.Easy][rating]);next={...result.card,due:new Date(result.card.due).toISOString(),last_review:result.card.last_review?new Date(result.card.last_review).toISOString():undefined};}}catch(e){console.warn('FSRS 暂不可用',e)}
if(next)c.fsrs=next;else{const m=[0,10,1440,3*1440,7*1440][rating];c.due=new Date(Date.now()+m*60*1000).toISOString();c.fsrs=null}c.reviewCount=(c.reviewCount||0)+1;await putMany('cards',[c]);await putMany('logs',[{id:uid(),cardId:c.id,at:iso(),rating,fsrs:!!next}]);activeId='';flipped=false;await refresh()}
function action(cb){return Promise.resolve().then(cb).catch(e=>alertMsg('操作未完成：'+(e?.message||e)))}
document.addEventListener('click',e=>{const el=e.target.closest('[data-tab],[data-go],[data-subject],[data-card-open],[data-detail-back],[data-detail-toggle],[data-detail-edit],[data-create],[data-edit],[data-cancel],[data-flip],[data-rate],[data-clear],[data-save],[data-confirm-import],[data-cancel-import],[data-parse-paste],[data-show-paste],[data-edit-preview],[data-delete],[data-remove],[data-backup],[data-img-open],[data-image-close],[data-image-zoom],[data-parse-overwrite],[data-apply-overwrite],[data-folder-open],[data-add-root],[data-add-folder],[data-rename-folder],[data-delete-folder],[data-folder-move],[data-confirm-folder-move],[data-create-folder],[data-import-folder],[data-library-folder],[data-select-visible],[data-merge-preview],[data-merge-save],[data-merge-cancel],[data-refresh-page],[data-install-help],[data-trash-restore],[data-move-selected],[data-move-one],[data-more]');if(!el)return;action(async()=>{const d=el.dataset;if(d.refreshPage){if((draft||preview.length||pasteText.trim()||replacePasteText.trim())&&!confirm('当前可能有未保存的编辑或粘贴内容。仍然刷新网页吗？'))return;window.location.reload();return}else if(d.installHelp){installHelpShown=!installHelpShown;render();return}else if(d.imageClose){closeImage();return}else if(d.imageZoom){zoomImage(d.imageZoom);return}else if(d.imgOpen){openImage(el);return}else if(d.parseOverwrite){prepareOverwrite();return}else if(d.applyOverwrite){applyOverwrite();return}else if(d.folderOpen){folderView=d.folderOpen;tab='folder';listLimit=80;search='';draft=null;viewId='';notice='';render()}else if(d.addRoot){await newFolder(null)}else if(d.addFolder){await newFolder(d.addFolder)}else if(d.renameFolder){await renameFolder(d.renameFolder)}else if(d.deleteFolder){await deleteFolder(d.deleteFolder)}else if(d.folderMove){folderMoveId=folderMoveId===d.folderMove?'':d.folderMove;render()}else if(d.confirmFolderMove){const value=$('#folderMoveTarget')?.value;await moveFolder(d.confirmFolderMove,value==='root'?null:value)}else if(d.createFolder){const id=d.createFolder;draft=normalizeCard({subject:rootFor(id)?.id||'major',deck:folder(id)?.name||''},rootFor(id)?.id||'major');draft.folderId=id;tab='folder';render()}else if(d.importFolder){importFolder=d.importFolder;tab='import';render()}else if(d.libraryFolder){libraryFolder=d.libraryFolder;tab='library';listLimit=80;selectedCardIds.clear();search='';render()}else if(d.trashRestore){await untrashCard(d.trashRestore)}else if(d.mergePreview){previewMerge()}else if(d.mergeSave){await saveMergedCard()}else if(d.mergeCancel){mergePreview=null;render()}else if(d.selectVisible){mergePreview=null;const present=orderedByImport((libraryFolder==='all'?cards:cardsUnder(libraryFolder)).filter(c=>!search||`${c.front||''} ${c.back||''} ${cleanTags(c.tags).join(' ')}`.toLowerCase().includes(search.toLowerCase()))).slice(0,listLimit);const allSelected=present.length&&present.every(c=>selectedCardIds.has(c.id));for(const c of present)allSelected?selectedCardIds.delete(c.id):selectedCardIds.add(c.id);render()}else if(d.moveSelected){const destination=$('#moveTarget')?.value;const ids=[...selectedCardIds].filter(id=>{const c=cards.find(x=>x.id===id);return c&&(libraryFolder==='all'||descendants(libraryFolder).has(cardFolder(c)))&&(!search||`${c.front||''} ${c.back||''} ${cleanTags(c.tags).join(' ')}`.toLowerCase().includes(search.toLowerCase()))});await relocateCards(ids,destination)}else if(d.moveOne){await relocateCards([d.moveOne],$('#oneMoveTarget')?.value)}else if(d.more){listLimit+=80;render()}else if(d.tab||d.go){mergePreview=null;tab=d.tab||d.go;if(tab==='library')libraryFolder='all';listLimit=80;viewId='';draft=null;editPreview=false;activeId='';flipped=false;notice='';render()}else if(d.subject){filter=d.subject;search='';tab='library';draft=null;viewId='';detailAnswer=false;notice='';render()}else if(d.cardOpen){viewId=d.cardOpen;detailAnswer=false;render()}else if(d.detailBack){viewId='';detailAnswer=false;render()}else if(d.detailToggle){detailAnswer=!detailAnswer;render()}else if(d.detailEdit){const c=cards.find(x=>x.id===d.detailEdit);if(!c)throw Error('无法找到该卡片');draft=editCopy(c);viewId='';editPreview=false;replacePasteText='';replacePending=null;render()}else if(d.clear){notice='';render()}else if(d.create){const target=folder(libraryFolder)?libraryFolder:folder(folderView)?folderView:'major';draft=normalizeCard({subject:rootFor(target)?.id||'major',deck:folder(target)?.name||'专业课'},rootFor(target)?.id||'major');draft.folderId=target;editPreview=false;replacePasteText='';replacePending=null;render()}else if(d.edit){draft=editCopy(cards.find(c=>c.id===d.edit));editPreview=false;replacePasteText='';replacePending=null;render()}else if(d.cancel){draft=null;editPreview=false;replacePasteText='';replacePending=null;render()}else if(d.flip){flipped=true;render()}else if(d.rate){await rate(d.rate)}else if(d.save){await saveDraft()}else if(d.delete){if(confirm('将这张卡片移入回收站？以后可以从「设置 → 回收站」恢复。')){await archiveCards([d.delete]);draft=null;viewId='';editPreview=false;tab='library';await refresh();alertMsg('卡片已移入回收站，随时可以恢复')}}else if(d.remove){captureDraftFields();const [side,idx]=d.remove.split(':');draft[side+'Images'].splice(Number(idx),1);render()}else if(d.editPreview){captureDraftFields();editPreview=!editPreview;render()}else if(d.showPaste){$('#pasteCards')?.focus()}else if(d.parsePaste){preparePaste()}else if(d.cancelImport){preview=[];render()}else if(d.confirmImport){const keys=new Set(cards.map(c=>[c.subject,c.front,c.back].join('|')));const fresh=[];for(const c of preview){const k=[c.subject,c.front,c.back].join('|');if(!keys.has(k)){fresh.push(c);keys.add(k)}}const commitTime=iso(),firstSequence=nextImportSequence();fresh.forEach((c,i)=>{c.importedAt=commitTime;c.importSequence=firstSequence+i});await putMany('cards',fresh);for(const c of fresh)tree.placements[c.id]=c.folderId||'major';await saveTree();const skip=preview.length-fresh.length;preview=[];pasteText='';tab='library';await refresh();alertMsg(`导入成功 ${fresh.length} 张，跳过 ${skip} 张重复`)}else if(d.backup){download('研记_完整备份_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({kind:'yanji.singlefile.backup.v1.12',exportedAt:iso(),cards,logs,folders:tree,trashCards},null,2));alertMsg('完整备份已导出（含回收站），请保存到 iPhone 文件或 iCloud Drive')};})});
document.addEventListener('change',e=>action(async()=>{const id=e.target.id;if(id==='dateSort'){dateSort=e.target.value;mergePreview=null;listLimit=80;render()}else if(id==='libraryFolder'){libraryFolder=e.target.value;mergePreview=null;selectedCardIds.clear();listLimit=80;render()}else if(id==='filter'){filter=e.target.value;render()}else if(id==='search'){search=e.target.value;refreshSearchResults()}else if(id==='importfile'){const files=Array.from(e.target.files||[]);e.target.value='';if(files.length)await filesToPreview(files)}else if(id==='importFolder'){importFolder=e.target.value;preview=[];render()}else if(id==='importDeck'){importDeck=e.target.value}else if(id==='ffrontImg'||id==='fbackImg'){await addImages(e.target.files,id==='ffrontImg'?'front':'back')}else if(id==='restorefile'){const f=e.target.files?.[0];e.target.value='';if(!f)return;const data=JSON.parse(await f.text());if(!Array.isArray(data.cards)||!Array.isArray(data.logs))throw Error('备份文件格式不正确');if(data.folders)validateImportedTree(data.folders);if(data.trashCards!==undefined&&(!Array.isArray(data.trashCards)||data.trashCards.some(c=>!c||typeof c.id!=='string'||!c.id)))throw Error('回收站备份格式无效');if(confirm(`危险操作：这会删除当前 ${cards.length} 张卡片与 ${logs.length} 条复习记录，再恢复备份中的 ${data.cards.length} 张。升级不需要此操作。是否仍要继续？`)&&confirm('最终确认：已经单独保存了当前完整备份，且确实要覆盖现有卡片和复习记录吗？')){await replaceAll(data);await refresh();if(data.folders&&Array.isArray(data.folders.nodes)&&data.folders.placements){tree=structuredClone(data.folders)}else{tree={nodes:DEFAULT_FOLDERS.map(x=>({...x})),placements:{}}}ensureFolders();await saveTree();if(Array.isArray(data.trashCards))await trashReplace(data.trashCards);await refresh();alertMsg(Array.isArray(data.trashCards)?'备份恢复成功（含回收站）':'旧版备份已恢复，现有回收站仍保留')}}}));
document.addEventListener('change',e=>{const cardId=e.target.dataset.selectCard;if(cardId){if(e.target.checked)selectedCardIds.add(cardId);else selectedCardIds.delete(cardId);mergePreview=null;render()}});
document.addEventListener('input',e=>{if(e.target.id==='overwritePaste'){replacePasteText=e.target.value;replacePending=null}else if(e.target.id==='pasteCards'){pasteText=e.target.value}else if(e.target.id==='importDeck'){importDeck=e.target.value}else if(e.target.id==='search'){search=e.target.value;mergePreview=null;selectedCardIds.clear();listLimit=80;if(!searchComposing&&!e.isComposing)refreshSearchResults()}});
document.addEventListener('compositionstart',e=>{if(e.target.id==='search')searchComposing=true});

(async()=>{try{db=await dbOpen();cards=await storeAll('cards');logs=await storeAll('logs');await initTree();trashDb=await trashOpen();trashCards=await trashRead();// 仅建立目录索引，读取旧卡片，不更改旧卡片、图片、FSRS 或日志。
ready=true;render();}catch(e){ready=true;alertMsg('初始化失败：'+e.message)}})();

$('#imageLightbox').addEventListener('click',e=>{if(e.target.id==='imageLightbox')closeImage()});
