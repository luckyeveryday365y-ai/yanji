:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft Yahei",sans-serif;color:#20283e;background:#f6f7fb;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}.shell{max-width:680px;margin:auto;min-height:100dvh;padding:0 16px 105px}.top{padding:24px 0 14px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:850;font-size:26px;letter-spacing:.05em}.muted{color:#747e91}.pill{background:#e8f0ff;color:#2958a6;border-radius:99px;font-size:12px;padding:5px 10px}.panel{background:#fff;border:1px solid #e9edf5;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 2px 8px #1b286006}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#fff;border:1px solid #e9edf5;border-radius:15px;padding:18px 8px;text-align:center}.stat strong{display:block;font-size:26px;color:#3159ad}.stat span{font-size:12px;color:#7a8393}.btn{border:0;background:#3667ce;color:white;border-radius:12px;padding:12px 15px;font-weight:650}.btn.secondary{background:#eef2fa;color:#2b4265}.btn.danger{background:#ffeaea;color:#ac273a}.btn.ghost{background:none;color:#4265a0;border:1px solid #d7e0ef}.btn.full{width:100%}.flex{display:flex;gap:9px;align-items:center}.wrap{flex-wrap:wrap}.grow{flex:1}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-evenly;background:#fff;border-top:1px solid #e6e9ef;padding:9px 0 calc(9px + env(safe-area-inset-bottom));z-index:10}.nav button{flex:1;background:none;color:#74819a;border:0;font-size:12px;display:flex;flex-direction:column;gap:4px;align-items:center}.nav button.active{color:#305ebc;font-weight:700}.nav b{font-size:19px;font-weight:500}.section-title{font-size:18px;font-weight:780;margin:18px 0 8px}.deck{padding:15px 0;border-bottom:1px solid #edf0f6;display:flex;gap:10px;align-items:center}.deck:last-child{border:0}.deck-button{width:100%;border:0;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer;border-radius:10px}.deck-button:active{background:#edf3ff}.deck-button:focus-visible,.card-link:focus-visible{outline:3px solid #87a8ff;outline-offset:2px}.card-link{padding:2px 0;display:block;width:100%;border:0;background:transparent;color:inherit;text-align:left;cursor:pointer;font:inherit}.card-link:active{color:#2455b3}.deck .dicon{background:#eff3ff;border-radius:11px;width:38px;height:38px;display:grid;place-items:center}.deck .title{font-weight:700}.deck .hint{font-size:12px;color:#8892a5;margin-top:3px}.tag{display:inline-block;background:#edf2fe;color:#4366a9;padding:4px 8px;border-radius:7px;font-size:12px;margin:3px 4px 3px 0}.card-area{padding:18px;min-height:260px;border-radius:18px;background:#fff;border:1px solid #e6eaf3;box-shadow:0 2px 8px #28305708}.card-area h3{margin:0 0 15px}.card-area img{max-width:100%;max-height:420px;object-fit:contain;border-radius:10px;margin-top:8px}.rich{font-size:16px;line-height:1.85;overflow-wrap:anywhere;white-space:normal}.rich p{margin:7px 0}.rich code{background:#f1f4fa;padding:2px 5px;border-radius:4px}.rich .katex-display{overflow-x:auto;overflow-y:hidden;padding:6px 0}.rating{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.rating button{border:0;border-radius:9px;padding:13px 3px;font-size:14px;font-weight:700}.rating button:nth-child(1){background:#ffdddd;color:#9b2d35}.rating button:nth-child(2){background:#fff1d5;color:#94621d}.rating button:nth-child(3){background:#e2f0ff;color:#2057a0}.rating button:nth-child(4){background:#d7f4e2;color:#187244}.field{display:block;margin:13px 0}.field label{display:block;font-size:13px;font-weight:700;color:#536076;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #d7deec;border-radius:11px;padding:11px;background:#fff;color:#29344a}.field textarea{resize:vertical;min-height:95px}.small{font-size:12px}.divider{height:1px;background:#ecf0f5;margin:15px 0}.notice{margin:12px 0;background:#eef5ff;padding:12px;border-radius:10px;color:#25549a;font-size:13px}.empty{text-align:center;color:#8a93a3;padding:45px 14px}.hidden{display:none!important}.import-zone{display:block;text-align:center;border:1.5px dashed #a7b9dc;border-radius:16px;background:#f6f9ff;padding:30px 14px;cursor:pointer}.import-zone input{display:none}.list-card{padding:13px 0;border-bottom:1px solid #edf0f5}.list-card:last-child{border:0}.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}.image-preview{display:flex;gap:8px;flex-wrap:wrap}.image-preview img{width:100px;height:100px;object-fit:contain;border:1px solid #e5e9f4;border-radius:10px}.image-preview .item{position:relative}.image-preview .item button{position:absolute;right:-5px;top:-5px;border:0;border-radius:50%;background:#bc2944;color:#fff;width:21px;height:21px}.katex-error{color:#b53a3a}.warn{background:#fff3de;color:#80521a;padding:10px;border-radius:9px}.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice-tile{border:1px solid #dbe5f4;background:#f9fbff;border-radius:14px;padding:14px;text-align:left;color:#2d4778;font-weight:700}.choice-tile .small{display:block;margin-top:6px;font-weight:400;color:#65748e}.choice-tile:active{background:#e7efff}.paste-area{min-height:200px!important;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.6}.sample{background:#f5f7fb;border-radius:9px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.65}.outline-card{border:1px solid #e5ebf5;border-radius:12px;padding:12px;margin:9px 0;background:#fff}.edit-preview{padding:14px;border-radius:12px;background:#f8faff;border:1px solid #dfe8f7;margin:12px 0}.tabs-note{margin:10px 0;color:#667693;font-size:13px}

<body><div class="shell"><header class="top"><div><div class="brand">📘 研记</div><div class="small muted">考研全科记忆 · V1.4 学科浏览修复</div></div><span class="pill" id="mode">本地存储</span></header><main id="view"></main></div>
<nav class="nav" id="nav"><button data-tab="home"><b>⌂</b>首页</button><button data-tab="review"><b>▤</b>复习</button><button data-tab="library"><b>▦</b>卡片库</button><button data-tab="import"><b>⇧</b>导入</button><button data-tab="settings"><b>⚙</b>设置</button></nav>
<script>
(()=>{'use strict';
const DB_NAME='yanji-mobile-v1',TABLE='cards';const SUBJECTS={math:'考研数学一',major:'专业课',english:'考研英语',politics:'考研政治'};
const $=s=>document.querySelector(s), uid=()=>globalThis.crypto?.randomUUID?.()||('id'+Date.now()+Math.random().toString(16).slice(2));
let db, cards=[],logs=[],tab='home',notice='',filter='all',search='',activeId='',flipped=false,draft=null,preview=[],fsrsLib=null,ready=false,pasteText='',importSubject='major',importDeck='',editPreview=false,viewId='',detailAnswer=false;
const esc=t=>String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const iso=()=>new Date().toISOString();const cleanTags=t=>Array.isArray(t)?t.map(String).filter(Boolean):String(t||'').split(/[,，、]/).map(x=>x.trim()).filter(Boolean);
function dbOpen(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('cards'))d.createObjectStore('cards',{keyPath:'id'});if(!d.objectStoreNames.contains('logs'))d.createObjectStore('logs',{keyPath:'id'});};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function storeAll(name){return new Promise((res,rej)=>{const r=db.transaction(name,'readonly').objectStore(name).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function putMany(name,items){return new Promise((res,rej)=>{const tx=db.transaction(name,'readwrite');for(const item of items)tx.objectStore(name).put(item);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
function deleteOne(name,id){return new Promise((res,rej)=>{const tx=db.transaction(name,'readwrite');tx.objectStore(name).delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
function replaceAll(data){return new Promise((res,rej)=>{const tx=db.transaction(['cards','logs'],'readwrite');tx.objectStore('cards').clear();tx.objectStore('logs').clear();for(const c of data.cards)tx.objectStore('cards').put(c);for(const l of data.logs)tx.objectStore('logs').put(l);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function refresh(){cards=await storeAll('cards');logs=await storeAll('logs');render()}
function alertMsg(m){notice=m;render()}
function normalizeImg(list){return (Array.isArray(list)?list:[]).map(im=>typeof im==='string'?{dataUrl:im,alt:''}:{dataUrl:im?.dataUrl||im?.src||im?.data||'',alt:im?.alt||im?.name||''}).filter(im=>/^data:image\/(png|jpeg|jpg|webp|gif|heic|heif);base64,/i.test(im.dataUrl)).slice(0,6)}
function normalizeCard(x,override){const n=x?.note||{};return {id:uid(),subject:SUBJECTS[x.subject]?x.subject:override||'major',deck:String(x.deck||x.deckName||SUBJECTS[override]||SUBJECTS[x.subject]||'专业课'),front:String(x.front||x.question||n.front||n.text||''),back:String(x.back||x.answer||n.back||n.meaning||''),tags:cleanTags(x.tags||n.tags||n.themes),frontImages:normalizeImg(x.frontImages||x.images?.front||[]),backImages:normalizeImg(x.backImages||x.images?.back||[]),createdAt:iso(),due:iso(),fsrs:null,reviewCount:0};}
function demo(){return [{subject:'major',deck:'数字信号处理',front:'单位阶跃序列与任意离散序列卷积，结果是什么？',back:'$$\\boxed{x(n)*\\varepsilon(n)=\\sum_{k=-\\infty}^{n}x(k)}$$\n\n**记忆：** 与单位阶跃序列卷积对应离散累加。',tags:['卷积','结论']},{subject:'major',deck:'数字信号处理',front:'从离散卷积定义推导：\n\n$$x(n)*\\varepsilon(n)=\\sum_{k=-\\infty}^{n}x(k)$$',back:'**① 卷积定义**\n\n$$x(n)*\\varepsilon(n)=\\sum_{k=-\\infty}^{+\\infty}x(k)\\varepsilon(n-k)$$\n\n**② 阶跃条件**\n\n$$\\varepsilon(n-k)=\\begin{cases}1,&k\\le n\\\\0,&k>n\\end{cases}$$\n\n**③ 改变求和范围**\n\n$$\\boxed{x(n)*\\varepsilon(n)=\\sum_{k=-\\infty}^{n}x(k)}$$',tags:['卷积','推导默写']}].map(x=>normalizeCard(x,x.subject))}
function mathBlock(text,display){try{if(window.katex)return window.katex.renderToString(text,{displayMode:display,throwOnError:false,strict:'ignore',trust:false});}catch(e){}return '<code>'+esc(display?'$$'+text+'$$':'$'+text+'$')+'</code>'}
function inlineBasic(t){let s=esc(t);s=s.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');return s.replace(/\n/g,'<br>')}
function rich(t){const input=String(t||'');const re=/(\$\$[\s\S]*?\$\$|\$(?:\\.|[^$\n])+\$)/g;return input.split(re).map(p=>p.startsWith('$$')&&p.endsWith('$$')?mathBlock(p.slice(2,-2),true):p.startsWith('$')&&p.endsWith('$')&&p.length>2?mathBlock(p.slice(1,-1),false):inlineBasic(p)).join('')}
function imageHTML(list){return normalizeImg(list).map(i=>`<img src="${i.dataUrl}" alt="${esc(i.alt)}">`).join('')}
function tagsHTML(list){return cleanTags(list).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}
function dueCards(){const now=Date.now();return cards.filter(c=>new Date(c.fsrs?.due||c.due||0).getTime()<=now).sort((a,b)=>new Date(a.fsrs?.due||a.due||0)-new Date(b.fsrs?.due||b.due||0))}
function base(title,sub=''){return `<div class="row"><h2 class="section-title">${title}</h2>${sub}</div>`}
function panel(s){return `<section class="panel">${s}</section>`}
function counts(){return Object.entries(SUBJECTS).map(([k,label])=>{const cs=cards.filter(c=>c.subject===k);return `<button type="button" class="deck deck-button" data-subject="${k}" aria-label="进入${label}，查看${cs.length}张卡片"><span class="dicon">${{math:'∑',major:'〽',english:'Aa',politics:'▣'}[k]}</span><span class="grow"><span class="title" style="display:block">${label}</span><span class="hint" style="display:block">${cs.length} 张卡片 · ${cs.filter(x=>dueCards().some(d=>d.id===x.id)).length} 张待复习</span></span><span class="muted">›</span></button>`}).join('')}
function upgradeReport(){const imageCards=cards.filter(c=>(c.frontImages?.length||0)+(c.backImages?.length||0)>0).length;const hasExisting=cards.length>0||logs.length>0;return panel(`<h3>🛡️ 旧数据核对（只读）</h3><p class="small muted">本页面与原版共用 yanji-mobile-v1 本地数据库。此处只读取，不会因为打开新版而清空或重置学习进度。</p><div class="stats"><div class="stat"><strong>${cards.length}</strong><span>现有卡片</span></div><div class="stat"><strong>${logs.length}</strong><span>复习记录</span></div><div class="stat"><strong>${imageCards}</strong><span>含图片卡片</span></div></div>${hasExisting?'<p class="small" style="margin-bottom:0">请核对以上数字是否与旧版一致。确认后可继续使用新版。</p>':'<p class="warn small">没有读取到旧卡片。如果旧版有内容，请先返回原来的网址检查，暂不要重新导入或创建卡片。iPhone Safari 与添加到主屏幕的独立 App 可能使用不同存储空间。</p>'}<button class="btn secondary full" data-backup="1" style="margin-top:12px">先导出完整备份（含图片及复习记录）</button>`)}
function home(){const due=dueCards().length;const today=logs.filter(x=>new Date(x.at).toDateString()===new Date().toDateString()).length;return `<div class="stats"><div class="stat"><strong>${due}</strong><span>待复习</span></div><div class="stat"><strong>${cards.length}</strong><span>总卡片</span></div><div class="stat"><strong>${today}</strong><span>今日完成</span></div></div>${panel(`<h3>今日复习</h3><p class="muted small">数学一 · 专业课 · 英语 · 政治</p><button class="btn full" data-go="review">${due?'开始复习 '+due+' 张':'查看复习计划'}</button>`)}${panel(`<h3>添加卡片</h3><div class="choice-grid"><button class="choice-tile" data-go="import">📋 粘贴导入<span class="small">复制 ChatGPT / Mochi 格式，一次生成多张卡</span></button><button class="choice-tile" data-create="1">✏️ 手动新建<span class="small">自己输入问题、答案，附加图片与公式</span></button></div>`)}${upgradeReport()}${panel(base('我的学科')+counts())}`}
function review(){const due=dueCards();if(!due.length)return panel('<div class="empty"><h3>今日复习完成 🎉</h3><p>所有到期卡片都已处理。</p></div>');const c=due.find(x=>x.id===activeId)||due[0];activeId=c.id;return `${base('开始复习',`<span class="small muted">待复习 ${due.length} 张</span>`)}${panel(`<div class="row"><span class="pill">${esc(SUBJECTS[c.subject])}</span><span class="small muted">${esc(c.deck)}</span></div><div class="divider"></div><div class="card-area"><div class="rich">${rich(flipped?c.back:c.front)}</div>${imageHTML(flipped?c.backImages:c.frontImages)}</div><div class="divider"></div>${flipped?`<div class="rating"><button data-rate="1">忘记</button><button data-rate="2">困难</button><button data-rate="3">良好</button><button data-rate="4">简单</button></div><p class="muted small">评分将更新这张卡片的下一次复习时间。</p>`:`<button class="btn full" data-flip="1">显示答案</button>`}`)}`}
function cardDetail(){const c=cards.find(x=>x.id===viewId);if(!c){viewId='';return library()}return `${base('查看卡片',`<button class="btn secondary" data-detail-back="1">← 返回卡片库</button>`)}${panel(`<div class="row"><span class="pill">${esc(SUBJECTS[c.subject]||c.subject)}</span><span class="small muted">${esc(c.deck)}</span></div><div class="divider"></div><h3>问题</h3><div class="rich">${rich(c.front)}</div>${imageHTML(c.frontImages)}<div class="divider"></div>${detailAnswer?`<h3>答案及推导</h3><div class="rich">${rich(c.back)}</div>${imageHTML(c.backImages)}`:`<button class="btn full" data-detail-toggle="1">显示答案</button>`}${detailAnswer?`<button class="btn secondary full" data-detail-toggle="1" style="margin-top:10px">隐藏答案</button>`:''}<div class="divider"></div><div class="flex"><button class="btn secondary grow" data-detail-back="1">返回</button><button class="btn grow" data-detail-edit="${esc(c.id)}">编辑此卡</button></div>`)}${c.tags?.length?panel(`<b>标签</b><div>${tagsHTML(c.tags)}</div>`):''}`}
function library(){const found=cards.filter(c=>(filter==='all'||c.subject===filter)&&(!search||`${c.front} ${c.back} ${c.tags.join(' ')}`.toLowerCase().includes(search.toLowerCase())));return `${base(filter==='all'?'卡片库':`${SUBJECTS[filter]||'学科'} · 卡片`, `<div class="flex">${filter==='all'?'':`<button class="btn secondary" data-subject="all">全部学科</button>`}<button class="btn secondary" data-go="import">粘贴导入</button><button class="btn" data-create="1">＋ 新建</button></div>`)}${panel(`<div class="field"><label>学科分类</label><select id="filter">${[['all','全部'],...Object.entries(SUBJECTS)].map(([k,v])=>`<option value="${k}" ${filter===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>搜索卡片、主题或标签</label><input id="search" value="${esc(search)}" placeholder="例如：卷积、环境保护、重要性"></div><p class="small muted">共 ${found.length} 张</p>${found.length?found.map(c=>`<div class="list-card"><div class="row"><div class="grow" style="min-width:0"><button type="button" class="card-link" data-card-open="${esc(c.id)}" aria-label="查看卡片"><strong class="truncate" style="display:block">${esc(c.front.replace(/\$+/g,'').slice(0,90))}</strong><span class="small muted" style="display:block">${esc(c.deck)} · 点击查看内容</span></button>${tagsHTML(c.tags)}</div><button class="btn secondary" data-edit="${c.id}">编辑</button></div></div>`).join(''):'<div class="empty">未找到卡片。可以批量导入或手动新建。</div>'}`)}`}
function importPage(){return `${base('添加卡片')}${panel(`<div class="choice-grid"><button class="choice-tile" data-create="1">✏️ 手动新建<span class="small">独立输入正面、背面，添加公式和图片</span></button><button class="choice-tile" data-show-paste="1">📋 粘贴卡片<span class="small">复制 ChatGPT 或 Mochi 格式，可一次导入多张</span></button></div><p class="tabs-note">下方即可粘贴，无须先保存成文件。</p><div class="field"><label>选择学科</label><select id="importSubject">${Object.entries(SUBJECTS).map(([k,v])=>`<option value="${k}" ${importSubject===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>卡组名称（可选）</label><input id="importDeck" value="${esc(importDeck)}" placeholder="如：数字信号处理、经济学人作文素材"></div><div class="field"><label>粘贴卡片内容（Mochi / Markdown 格式）</label><textarea id="pasteCards" class="paste-area" placeholder="问题或记忆要求&#10;---&#10;答案、公式与完整推导&#10;///&#10;第二张卡片的问题&#10;---&#10;第二张卡片的答案">${esc(pasteText)}</textarea></div><button class="btn full" data-parse-paste="1">识别粘贴内容 → 预览卡片</button><details style="margin-top:13px"><summary class="small muted">查看粘贴格式示例</summary><div class="sample">离散卷积与单位阶跃序列的结论是什么？<br>---<br>$$x(n)*\\varepsilon(n)=\\sum_{k=-\\infty}^{n}x(k)$$<br>///<br>这一公式如何推导？<br>---<br>由卷积定义展开，并利用 k≤n 时阶跃函数为 1。</div><p class="small muted">注意：分隔符需要单独占一行。支持多行公式、Markdown 粗体与换行。</p></details>`)}${panel(`<h3>也可以从 iPhone「文件」批量导入</h3><label class="import-zone">📂<br><b>选择 .json / .md / .txt 文件</b><br><span class="muted small">含图片的卡组推荐 JSON</span><input id="importfile" type="file" accept=".json,.md,.markdown,.txt" multiple></label>`)}${preview.length?panel(`<div class="row"><h3>预览：${preview.length} 张卡片</h3><button class="btn ghost" data-cancel-import="1">取消预览</button></div>${preview.slice(0,8).map((c,i)=>`<div class="outline-card"><div class="small muted">第 ${i+1} 张 · ${esc(SUBJECTS[c.subject]||c.subject)} / ${esc(c.deck)}</div><div><strong>正面：</strong>${esc(c.front.slice(0,160))}</div><div class="muted small"><strong>背面：</strong>${esc(c.back.slice(0,160))}</div></div>`).join('')}${preview.length>8?`<p class="small muted">……还有 ${preview.length-8} 张</p>`:''}<button class="btn full" data-confirm-import="1">确认保存这 ${preview.length} 张卡片</button><p class="small muted">会自动跳过与现有卡片重复的内容，导入前不更改任何卡片。</p>`):''}`}
function captureDraftFields(){if(!draft)return;const f=$('#ffront');if(!f)return;draft.front=f.value;draft.back=$('#fback').value;draft.deck=$('#fdeck').value;draft.subject=$('#fsubject').value;draft.tags=cleanTags($('#ftags').value)}
function form(){const c=draft||normalizeCard({subject:'major',deck:'数字信号处理'},'major');draft=c;return `${base(c._edit?'编辑卡片':'手动新建卡片',`<button class="btn secondary" data-cancel="1">返回</button>`)}${panel(`<p class="small muted">正面输入题目，背面输入结论或推导。可直接输入 LaTeX，如 <code>$$\\sum_{k=0}^{n}x(k)$$</code>，也可从相册添加图片。</p><div class="field"><label>学科</label><select id="fsubject">${Object.entries(SUBJECTS).map(([k,v])=>`<option value="${k}" ${c.subject===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>卡组名称</label><input id="fdeck" value="${esc(c.deck)}"></div><div class="field"><label>正面（问题，支持 LaTeX）</label><textarea id="ffront" placeholder="例如：证明单位阶跃序列的卷积性质">${esc(c.front)}</textarea></div><div class="field"><label>正面图片</label><input type="file" id="ffrontImg" accept="image/*" multiple>${previewImages(c.frontImages,'front')}</div><div class="field"><label>背面（答案与推导）</label><textarea id="fback" placeholder="例如：$$x(n)*\\varepsilon(n)=\\sum_{k=-\\infty}^{n}x(k)$$">${esc(c.back)}</textarea></div><div class="field"><label>背面图片</label><input type="file" id="fbackImg" accept="image/*" multiple>${previewImages(c.backImages,'back')}</div><div class="field"><label>标签（逗号分隔，支持作文主题）</label><input id="ftags" value="${esc(c.tags.join(', '))}" placeholder="例如：卷积, 推导, 高频"></div><div class="flex"><button class="btn secondary grow" data-edit-preview="1">${editPreview?'隐藏预览':'预览正反面'}</button><button class="btn grow" data-save="1">${c._edit?'保存修改':'保存新卡'}</button></div>${editPreview?`<div class="edit-preview"><b>正面预览</b><div class="rich">${rich(c.front)}</div>${imageHTML(c.frontImages)}<div class="divider"></div><b>背面预览</b><div class="rich">${rich(c.back)}</div>${imageHTML(c.backImages)}</div>`:''}${c._edit?`<button class="btn danger full" data-delete="${c.id}" style="margin-top:12px">删除卡片</button>`:''}`)}`}
function previewImages(list,side){return `<div class="image-preview">${normalizeImg(list).map((im,i)=>`<div class="item"><img src="${im.dataUrl}"><button data-remove="${side}:${i}">×</button></div>`).join('')}</div>`}
function settings(){return `${base('设置与备份')}${panel(`<h3>数据安全</h3><p class="small muted">卡片、图片、学习进度存于当前 iPhone 浏览器的 IndexedDB。浏览器数据可能被系统清理，请定期备份。</p><button class="btn full" data-backup="1">导出全部备份（JSON）</button><label class="import-zone" style="margin-top:12px">从备份恢复<input type="file" id="restorefile" accept=".json"></label><p class="warn small">恢复会替换当前全部卡片和记录。请先下载备份。</p>`)}${panel(`<h3>版本说明</h3><p class="small">安全升级版 V1.4：修复首页学科导航和卡片详情浏览；支持直接粘贴 Mochi / Markdown 卡片、手动新建编辑、批量导入、公式显示、图片与本地存储。</p><p class="small">公式使用在线 KaTeX，FSRS 使用在线 ts-fsrs；未加载成功时会显示原始公式或回退基础调度。完整离线 PWA 缓存将在独立 Service Worker 部署后启用。</p><p class="small muted">不采集账号信息，不上传你的卡片数据。</p>`)}`}
function render(){const view=$('#view');if(!view)return;view.innerHTML=(notice?`<div class="notice">${esc(notice)} <button style="float:right" data-clear="1">×</button></div>`:'')+(!ready?panel('正在加载本地数据…'):draft?form():viewId?cardDetail():({home,review,library,import:importPage,settings}[tab]||home)());document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#mode').textContent=fsrsLib?'FSRS 已就绪':'本地存储'}
function download(name,text){const blob=new Blob([text],{type:'application/json;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),10000)}
function mdCards(t){const parts=String(t||'').replace(/\r\n?/g,'\n').replace(/^\uFEFF/,'').split(/^\s*\/\/\/\s*$/m).filter(x=>x.trim());if(!parts.length)return [];return parts.map((part,i)=>{const a=part.split(/^\s*---\s*$/m);if(a.length<2||!a[0].trim()||!a.slice(1).join('\n---\n').trim())throw Error(`第 ${i+1} 张卡片格式错误：必须包含正面、单独一行的 ---、背面`);return {front:a.shift().trim(),back:a.join('\n---\n').trim()}})}
function importOptions(){return {subject:$('#importSubject')?.value||importSubject||'major',deck:($('#importDeck')?.value||'').trim()}}
function toImportCards(raw,options){return raw.map(x=>normalizeCard({...x,deck:x.deck||x.deckName||options.deck||SUBJECTS[options.subject]},options.subject)).filter(c=>c.front.trim()&&c.back.trim())}
function preparePaste(){preview=[];pasteText=$('#pasteCards')?.value??pasteText;const options=importOptions();importSubject=options.subject;importDeck=options.deck;const raw=mdCards(pasteText);if(!raw.length)throw Error('请先粘贴卡片。用独立一行 --- 分隔正反面，多张卡用 /// 分隔');preview=toImportCards(raw,options);if(!preview.length)throw Error('未识别到有效卡片');alertMsg(`已识别 ${preview.length} 张，请在预览后点击确认保存`)}
async function filesToPreview(files){const options=importOptions();importSubject=options.subject;importDeck=options.deck;let all=[];for(const f of files){if(f.size>40*1024*1024)throw Error(`${f.name} 太大，请分批导入（单文件上限 40MB）`);const text=await f.text();let raw;if(/\.json$/i.test(f.name)){const data=JSON.parse(text);raw=Array.isArray(data)?data:(data.cards||data.items||data.notes||[]);if(!Array.isArray(raw))throw Error('JSON 没有 cards 数组');}else raw=mdCards(text);all.push(...toImportCards(raw,options))}if(!all.length)throw Error('未识别到有效卡片：请检查 JSON / Markdown 格式');preview=all;alertMsg(`读取成功：${all.length} 张，确认后才会保存`)}
async function addImages(fileList,side){if(!draft)return;captureDraftFields();const list=Array.from(fileList||[]);if(draft[side+'Images'].length+list.length>6)throw Error('每面最多 6 张图片');for(const file of list){if(!file.type.startsWith('image/'))throw Error('只能上传图片');if(file.size>4_000_000)throw Error('每张图片不能超过 4MB');const dataUrl=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(file)});draft[side+'Images'].push({dataUrl,alt:file.name})}render()}
async function saveDraft(){if(!draft)return;captureDraftFields();draft.deck=draft.deck.trim()||SUBJECTS[draft.subject];if(!draft.front.trim()||!draft.back.trim())throw Error('问题和答案都不能为空');const c={...draft};delete c._edit;await putMany('cards',[c]);draft=null;await refresh();alertMsg('卡片保存成功')}
async function rate(v){const c=cards.find(x=>x.id===activeId);if(!c)return;const rating=Number(v);let next=null;try{if(fsrsLib){const {fsrs,Rating,createEmptyCard}=fsrsLib;const old=c.fsrs?{...c.fsrs,due:new Date(c.fsrs.due),last_review:c.fsrs.last_review?new Date(c.fsrs.last_review):undefined}:createEmptyCard(new Date());const result=fsrs({request_retention:0.9}).next(old,new Date(),[null,Rating.Again,Rating.Hard,Rating.Good,Rating.Easy][rating]);next={...result.card,due:new Date(result.card.due).toISOString(),last_review:result.card.last_review?new Date(result.card.last_review).toISOString():undefined};}}catch(e){console.warn('FSRS 暂不可用',e)}
if(next)c.fsrs=next;else{const m=[0,10,1440,3*1440,7*1440][rating];c.due=new Date(Date.now()+m*60*1000).toISOString();c.fsrs=null}c.reviewCount=(c.reviewCount||0)+1;await putMany('cards',[c]);await putMany('logs',[{id:uid(),cardId:c.id,at:iso(),rating,fsrs:!!next}]);activeId='';flipped=false;await refresh()}
function action(cb){return Promise.resolve().then(cb).catch(e=>alertMsg('操作未完成：'+(e?.message||e)))}
document.addEventListener('click',e=>{const el=e.target.closest('[data-tab],[data-go],[data-subject],[data-card-open],[data-detail-back],[data-detail-toggle],[data-detail-edit],[data-create],[data-edit],[data-cancel],[data-flip],[data-rate],[data-clear],[data-save],[data-confirm-import],[data-cancel-import],[data-parse-paste],[data-show-paste],[data-edit-preview],[data-delete],[data-remove],[data-backup]');if(!el)return;action(async()=>{const d=el.dataset;if(d.tab||d.go){tab=d.tab||d.go;viewId='';draft=null;editPreview=false;activeId='';flipped=false;notice='';render()}else if(d.subject){filter=d.subject;search='';tab='library';draft=null;viewId='';detailAnswer=false;notice='';render()}else if(d.cardOpen){viewId=d.cardOpen;detailAnswer=false;render()}else if(d.detailBack){viewId='';detailAnswer=false;render()}else if(d.detailToggle){detailAnswer=!detailAnswer;render()}else if(d.detailEdit){const c=cards.find(x=>x.id===d.detailEdit);if(!c)throw Error('无法找到该卡片');draft={...c,_edit:true};viewId='';editPreview=false;render()}else if(d.clear){notice='';render()}else if(d.create){draft=normalizeCard({subject:filter!=='all'?filter:'major',deck:SUBJECTS[filter]||'数字信号处理'},filter!=='all'?filter:'major');editPreview=false;render()}else if(d.edit){draft={...cards.find(c=>c.id===d.edit),_edit:true};editPreview=false;render()}else if(d.cancel){draft=null;editPreview=false;render()}else if(d.flip){flipped=true;render()}else if(d.rate){await rate(d.rate)}else if(d.save){await saveDraft()}else if(d.delete){if(confirm('确定删除这张卡片吗？')){await deleteOne('cards',d.delete);draft=null;editPreview=false;await refresh()}}else if(d.remove){captureDraftFields();const [side,idx]=d.remove.split(':');draft[side+'Images'].splice(Number(idx),1);render()}else if(d.editPreview){captureDraftFields();editPreview=!editPreview;render()}else if(d.showPaste){$('#pasteCards')?.focus()}else if(d.parsePaste){preparePaste()}else if(d.cancelImport){preview=[];render()}else if(d.confirmImport){const keys=new Set(cards.map(c=>[c.subject,c.front,c.back].join('|')));const fresh=[];for(const c of preview){const k=[c.subject,c.front,c.back].join('|');if(!keys.has(k)){fresh.push(c);keys.add(k)}}await putMany('cards',fresh);const skip=preview.length-fresh.length;preview=[];pasteText='';tab='library';await refresh();alertMsg(`导入成功 ${fresh.length} 张，跳过 ${skip} 张重复`)}else if(d.backup){download('研记_完整备份_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({kind:'yanji.singlefile.backup.v1',exportedAt:iso(),cards,logs},null,2));alertMsg('备份文件已生成，请保存到 iPhone「文件」')};})});
document.addEventListener('change',e=>action(async()=>{const id=e.target.id;if(id==='filter'){filter=e.target.value;render()}else if(id==='search'){search=e.target.value;render()}else if(id==='importfile'){const files=Array.from(e.target.files||[]);e.target.value='';if(files.length)await filesToPreview(files)}else if(id==='importSubject'){importSubject=e.target.value}else if(id==='importDeck'){importDeck=e.target.value}else if(id==='ffrontImg'||id==='fbackImg'){await addImages(e.target.files,id==='ffrontImg'?'front':'back')}else if(id==='restorefile'){const f=e.target.files?.[0];e.target.value='';if(!f)return;const data=JSON.parse(await f.text());if(!Array.isArray(data.cards)||!Array.isArray(data.logs))throw Error('备份文件格式不正确');if(confirm(`危险操作：这会删除当前 ${cards.length} 张卡片与 ${logs.length} 条复习记录，再恢复备份中的 ${data.cards.length} 张。升级不需要此操作。是否仍要继续？`)&&confirm('最终确认：已经单独保存了当前完整备份，且确实要覆盖现有卡片和复习记录吗？')){await replaceAll(data);await refresh();alertMsg('备份恢复成功')}}}));
document.addEventListener('input',e=>{if(e.target.id==='pasteCards'){pasteText=e.target.value}else if(e.target.id==='importDeck'){importDeck=e.target.value}else if(e.target.id==='search'){search=e.target.value;const pos=e.target.selectionStart;render();const inp=$('#search');inp?.focus();inp?.setSelectionRange(pos,pos)}});
(async()=>{try{db=await dbOpen();cards=await storeAll('cards');logs=await storeAll('logs');// 安全升级：加载时仅读取旧数据，不自动写入示例卡片。
ready=true;render();}catch(e){ready=true;alertMsg('初始化失败：'+e.message)}})();
import('https://esm.sh/ts-fsrs@5.2.0').then(lib=>{if(lib.fsrs&&lib.createEmptyCard){fsrsLib=lib;render()}}).catch(()=>{});
})();
</script>
</body></html>
